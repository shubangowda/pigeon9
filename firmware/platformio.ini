; PlatformIO project file for the Pigeon 9 flight computer
; Build and upload with: pio run -t upload   (or use the arrow button in VS Code)

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200

; These download automatically the first time you build
lib_deps =
  adafruit/Adafruit LSM6DS
  adafruit/Adafruit ADXL375
  adafruit/Adafruit BMP3XX Library
  sparkfun/SparkFun u-blox GNSS Arduino Library
